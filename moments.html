<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minnie's Moments · Annual Timeline</title>

    <!-- Google Fonts: Bodoni Moda + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,900;1,6..96,400&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Pinyon+Script&family=Cinzel:wght@400;700;900&display=swap"
        rel="stylesheet">
    <!-- LXGW WenKai -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
    <link rel="icon" href="images/sunflower.svg" type="image/svg+xml">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Global Styles -->
    <link rel="stylesheet" href="css/style.css?v=9.4">
    <!-- Moments Specific Styles -->
    <link rel="stylesheet" href="css/moments.css?v=9.1">
    <link rel="stylesheet" href="css/day-6000.css?v=11.9">
</head>

<body>

    <!-- Ambient Light & Noise -->
    <div class="ambient-light"></div>
    <div class="noise-overlay"></div>

    <!-- Cursor -->
    <div class="cursor-torch" id="torch"></div>
    <div class="cursor-dot" id="dot"></div>

    <!-- ===================== HEADER ===================== -->
    <header class="app-header">
        <h1 class="logo">Love Minnie</h1>
        
        <!-- Center Title for Moments Page (Mobile mostly) -->
        <div class="page-title">
            <span class="en">Moments</span>
            <span class="cn">点滴·2026</span>
        </div>

        <!-- Desktop Nav -->
        <nav class="desktop-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="gallery.html" class="nav-link">Gallery</a>
            <a href="moments.html" class="nav-link active">Moments</a>
        </nav>

        <div class="header-actions">
           <!-- Theme toggle could go here -->
        </div>
    </header>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="moments-container" id="moments-feed">
        <!-- Connecting Line (The Timeline Axis) -->
        <div class="timeline-axis"></div>

        <!-- Moment Cards will be injected here via JS -->
        <!-- Example Structure for reference (generated by JS):
        <article class="moment-card">
            <div class="moment-date">
                <span class="month">JAN</span>
                <span class="day">11</span>
            </div>
            <div class="moment-content">
                <h2 class="moment-title">西安樊记肉夹馍</h2>
                <p class="moment-desc">...</p>
                <div class="moment-gallery grid-1">
                    <img src="...">
                </div>
            </div>
        </article>
        -->
    </main>

    <!-- ===================== MOBILE BOTTOM NAV ===================== -->
    <nav class="mobile-bottom-nav">
        <div class="nav-items">
            <a href="index.html" class="nav-item" aria-label="首页">
                <i class="fa-solid fa-house"></i>
                <span>首页</span>
            </a>
            <a href="gallery.html" class="nav-item" aria-label="画廊">
                <i class="fa-solid fa-images"></i>
                <span>画廊</span>
            </a>
            <!-- New Item -->
            <a href="moments.html" class="nav-item active" aria-label="点滴">
                <i class="fa-solid fa-timeline"></i>
                <span>点滴</span>
            </a>
            <button class="nav-item" id="nav-settings" aria-label="设置">
                <i class="fa-solid fa-gear"></i>
                <span>设置</span>
            </button>
        </div>
    </nav>

    <!-- ===================== LIGHTBOX (Simple Overlay) ===================== -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button class="lightbox-close">&times;</button>
        <div class="lightbox-content">
            <img src="" alt="Full view" id="lightbox-img">
        </div>
        <button class="lightbox-prev"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="lightbox-next"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="js/moments_data.js?v=9.1"></script>
    <script src="js/moments.js?v=9.1"></script>
    <script src="js/day-6000.js?v=11.9"></script>
    <script src="js/anniversary-effects.js?v=11.6"></script>
    <!-- Reusing cursor logic if possible, or simple cursor shim in moments.js -->
</body>

</html>
