<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#150d21">
    <title>Love Minnie · 画信</title>
    <link rel="icon" href="images/sunflower.svg" type="image/svg+xml">

    <!-- 字体全部本地托管：手机不挂 VPN 也能打开。Bodoni Moda / Pinyon Script 的 @font-face 在 day-6000.css -->
    <link rel="preload" href="fonts/memorial/bodoni-moda-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts/wenkai/lxgwwenkaiscreen.css">
    <link rel="stylesheet" href="css/style.css?v=12.1">
    <link rel="stylesheet" href="css/day-6000.css?v=12.1">
</head>

<body class="gallery-page" data-view="today">

    <!-- 线条图标（替代 Font Awesome，免外链） -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" /></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" /></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M4.5 10.6 12 4.5l7.5 6.1v8.1a1.3 1.3 0 0 1-1.3 1.3H14.6v-5.4H9.4V20H5.8a1.3 1.3 0 0 1-1.3-1.3z" /></symbol>
        <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><circle cx="12" cy="12" r="4.5" /></symbol>
        <symbol id="i-corridor" viewBox="0 0 24 24"><rect x="2.5" y="7" width="6" height="10" rx="1" /><rect x="10" y="5" width="11.5" height="14" rx="1" /></symbol>
        <symbol id="i-almanac" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.2" /><circle cx="12" cy="7" r="2.2" /><circle cx="18" cy="7" r="2.2" /><circle cx="6" cy="13.5" r="2.2" /><circle cx="12" cy="13.5" r="2.2" /><circle cx="18" cy="13.5" r="2.2" /><circle cx="6" cy="20" r="1.4" /><circle cx="12" cy="20" r="1.4" /></symbol>
        <symbol id="i-sparkle" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 3.6 13.7 9 19 10.7l-5.3 1.7L12 17.8l-1.7-5.4L5 10.7 10.3 9z" /></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 20.4 10.8 19.3C6.2 15.2 3.4 12.6 3.4 9.4 3.4 6.8 5.4 4.9 8 4.9c1.5 0 2.9.7 4 1.9 1.1-1.2 2.5-1.9 4-1.9 2.6 0 4.6 1.9 4.6 4.5 0 3.2-2.8 5.8-7.4 9.9z" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M5 19l1-4.2 9.6-9.6a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L9.2 18z" /></symbol>
        <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" /></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6.5 18.5 12 13 17.5" /></symbol>
        <!-- 季节的花：海棠四瓣、荷叶、桂花簇、梅花五瓣 -->
        <symbol id="i-spring" viewBox="0 0 12 12"><g fill="currentColor" stroke="none"><circle cx="6" cy="3.1" r="2" /><circle cx="8.9" cy="6" r="2" /><circle cx="6" cy="8.9" r="2" /><circle cx="3.1" cy="6" r="2" /></g></symbol>
        <symbol id="i-summer" viewBox="0 0 12 12"><path fill="currentColor" stroke="none" d="M6 1.2a4.8 4.8 0 1 0 4.8 4.8H6z" /></symbol>
        <symbol id="i-autumn" viewBox="0 0 12 12"><g fill="currentColor" stroke="none"><circle cx="6" cy="3" r="1.6" /><circle cx="3" cy="7" r="1.6" /><circle cx="9" cy="7" r="1.6" /><circle cx="6" cy="9.6" r="1.2" /></g></symbol>
        <symbol id="i-winter" viewBox="0 0 12 12"><g fill="currentColor" stroke="none"><circle cx="6" cy="2.8" r="1.7" /><circle cx="9.1" cy="5.1" r="1.7" /><circle cx="7.9" cy="8.8" r="1.7" /><circle cx="4.1" cy="8.8" r="1.7" /><circle cx="2.9" cy="5.1" r="1.7" /></g></symbol>
    </svg>

    <!-- 氛围：紫夜光场 + 噪点 + 今天那幅画的色调 -->
    <div class="ambient-light"></div>
    <div class="noise-overlay"></div>
    <div class="bg-blur" id="bg-blur"></div>
    <div class="cursor-torch" id="torch"></div>

    <!-- ===================== 顶栏 ===================== -->
    <header class="lm-header">
        <a href="index.html" class="lm-mark" id="lm-home-link" aria-label="回首页">LOVE MINNIE</a>
        <nav class="lm-tabs" aria-label="画廊">
            <a href="#today" class="lm-tab" data-view="today">今日</a>
            <a href="#corridor" class="lm-tab" data-view="corridor">长廊</a>
            <a href="#calendar" class="lm-tab" data-view="calendar">画历</a>
        </nav>
        <div class="lm-header-end">
            <button type="button" class="lm-season" id="season-btn" aria-haspopup="dialog" aria-controls="season-sheet">
                <svg class="lm-season-flower" aria-hidden="true"><use href="#i-autumn" /></svg>
                <span id="season-label">秋 · 桂</span>
            </button>
        </div>
    </header>

    <main class="lm-main">
        <!-- ===================== 今日 ===================== -->
        <section class="lm-view view-today" id="view-today" aria-label="今日画信">
            <!-- 今日画信：细金框的画 + 旁边一封信（邮戳、落款、印章），画下是这个月的月相尺；
                 窄屏画在上、信在下。横图竖图同一套版式，只按画的比例分配空间 -->
            <section id="today-hero" class="today-hero" hidden aria-label="今日画信">
                <div class="hero-stage">
                    <button type="button" class="hero-art" id="today-hero-art" aria-label="看大图">
                        <img id="today-hero-img" src="" alt="今日画作" fetchpriority="high">
                    </button>
                    <div class="hero-letter-col">
                        <article class="hero-letter">
                            <span class="hero-postmark" id="today-hero-postmark" aria-hidden="true"></span>
                            <p class="hero-no" id="today-hero-no"></p>
                            <p class="hero-note" id="today-hero-note" hidden></p>
                            <p class="hero-sign" id="today-hero-sign"></p>
                            <h2 class="hero-title" id="today-hero-title"></h2>
                            <span class="hero-rule" aria-hidden="true"></span>
                            <p class="hero-date" id="today-hero-date"></p>
                            <p class="hero-days" id="today-hero-days"></p>
                            <div class="hero-seal-row">
                                <span class="hero-hand" aria-hidden="true">love Minnie</span>
                                <span class="lm-seal" id="today-hero-seal" role="img" aria-label="落款：浩">浩</span>
                            </div>
                        </article>
                        <div class="hero-actions">
                            <button type="button" class="hero-action" id="today-hero-open">
                                <svg class="icon" aria-hidden="true"><use href="#i-expand" /></svg>
                                看大图
                            </button>
                            <a href="#corridor" class="hero-action" id="today-hero-walk">
                                沿长廊往回走
                                <svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg>
                            </a>
                        </div>
                    </div>
                    <div class="hero-ruler" id="today-hero-ruler"></div>
                </div>
            </section>

            <!-- 一封画信都没有时 -->
            <article id="empty-state" class="empty-state" hidden>
                <img src="images/sunflower.svg" class="sunflower-icon" alt="">
                <h2 class="empty-title" id="empty-title">花期未至</h2>
                <p class="empty-text empty-cn" id="empty-date-text"></p>
                <p class="empty-text empty-en" id="empty-subtext"></p>
            </article>
        </section>

        <!-- ===================== 长廊 ===================== -->
        <section class="lm-view view-corridor" id="view-corridor" aria-labelledby="corridor-title" hidden>
            <div class="view-head">
                <div class="view-title-row">
                    <h1 class="view-title" id="corridor-title">长廊</h1>
                    <p class="view-sub">沿着时间往回走，一步一天</p>
                </div>
                <nav class="month-chips" id="corridor-months" aria-label="跳到某个月"></nav>
            </div>
            <div class="corridor-scroll" id="corridor-scroll" tabindex="0" aria-label="画信长廊，左右滚动"></div>
            <div class="corridor-foot">
                <span class="corridor-end num" id="corridor-start"></span>
                <div class="corridor-track">
                    <div class="corridor-marks" id="corridor-marks" aria-hidden="true"></div>
                    <input type="range" class="corridor-range" id="corridor-range" min="0" max="1000" value="0" step="1" aria-label="在长廊里快速移动">
                </div>
                <span class="corridor-end num" id="corridor-end"></span>
                <span class="corridor-hint" id="corridor-hint">滚轮或拖动，沿长廊往回走</span>
            </div>
        </section>

        <!-- ===================== 画历 ===================== -->
        <section class="lm-view view-calendar" id="view-calendar" aria-labelledby="cal-month" hidden>
            <aside class="cal-side">
                <div class="cal-head">
                    <h1 class="cal-month" id="cal-month"></h1>
                    <div class="cal-nav">
                        <button type="button" class="cal-nav-btn" id="cal-prev">
                            <svg class="icon" aria-hidden="true"><use href="#i-prev" /></svg>
                            <span id="cal-prev-label"></span>
                        </button>
                        <button type="button" class="cal-nav-btn" id="cal-next">
                            <span id="cal-next-label"></span>
                            <svg class="icon" aria-hidden="true"><use href="#i-next" /></svg>
                        </button>
                    </div>
                </div>
                <p class="cal-en" id="cal-en"></p>
                <p class="cal-count" id="cal-count"></p>
                <div class="cal-special" id="cal-special-wrap">
                    <p class="cal-special-title">这个月的特别日子</p>
                    <ul class="cal-special-list" id="cal-special"></ul>
                </div>
                <button type="button" class="cal-random" id="memory-lane-btn">
                    <svg class="icon" aria-hidden="true"><use href="#i-sparkle" /></svg>
                    <span>随机重温一封</span>
                </button>
            </aside>
            <div class="cal-board">
                <div class="cal-weekdays" aria-hidden="true">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                </div>
                <div class="cal-grid" id="cal-grid"></div>
            </div>
        </section>
    </main>

    <!-- ===================== 手机底栏 ===================== -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="画廊">
        <div class="nav-items">
            <a class="nav-item" href="index.html" id="nav-home">
                <svg class="icon" aria-hidden="true"><use href="#i-home" /></svg>
                <span>首页</span>
            </a>
            <a class="nav-item" href="#today" data-view="today">
                <svg class="icon" aria-hidden="true"><use href="#i-today" /></svg>
                <span>今日</span>
            </a>
            <a class="nav-item" href="#corridor" data-view="corridor">
                <svg class="icon" aria-hidden="true"><use href="#i-corridor" /></svg>
                <span>长廊</span>
            </a>
            <a class="nav-item" href="#calendar" data-view="calendar">
                <svg class="icon" aria-hidden="true"><use href="#i-almanac" /></svg>
                <span>画历</span>
            </a>
        </div>
    </nav>

    <!-- ===================== 胶卷条（看画时出现） ===================== -->
    <nav class="timeline-strip" aria-label="按日期浏览">
        <button id="timeline-prev" class="timeline-nav-btn" aria-label="往前">
            <svg class="icon" aria-hidden="true"><use href="#i-prev" /></svg>
        </button>
        <div id="timeline-container" class="timeline-container"></div>
        <button id="timeline-next" class="timeline-nav-btn" aria-label="往后">
            <svg class="icon" aria-hidden="true"><use href="#i-next" /></svg>
        </button>
    </nav>

    <!-- ===================== 四季 ===================== -->
    <div class="season-overlay" id="season-overlay"></div>
    <div class="season-sheet" id="season-sheet" role="dialog" aria-modal="true" aria-labelledby="season-title" aria-hidden="true">
        <div class="season-head">
            <div>
                <h2 class="season-title" id="season-title">四季</h2>
                <p class="season-sub">季节只换花，不换夜。默认跟着日期走。</p>
            </div>
            <button type="button" class="season-close" id="season-close" aria-label="关闭">
                <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
            </button>
        </div>
        <div class="season-options" id="season-options" role="radiogroup" aria-label="季节"></div>
    </div>

    <!-- ===================== 看画 ===================== -->
    <div id="detail-modal" class="detail-modal" aria-hidden="true">
        <div class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <div class="detail-media">
                <img id="detail-image" src="" alt="">
                <p class="detail-hint" id="detail-hint" aria-hidden="true">左右滑动，看前后几天</p>
            </div>
            <aside class="detail-side">
                <span class="detail-postmark" id="detail-postmark" aria-hidden="true"></span>
                <div class="detail-header">
                    <div class="detail-meta">
                        <div id="detail-date" class="detail-date"></div>
                        <div id="detail-sub" class="detail-sub"></div>
                    </div>
                    <button id="detail-close" class="detail-close" type="button" aria-label="关闭">
                        <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
                    </button>
                </div>
                <div class="detail-body">
                    <div class="detail-letter-wrap">
                        <h2 id="detail-title" class="detail-title"></h2>
                        <div id="detail-letter" class="detail-letter"></div>
                        <p id="detail-sign" class="detail-sign"></p>
                        <div class="detail-seal-row">
                            <span class="detail-hand" aria-hidden="true">love Minnie</span>
                            <span class="lm-seal" id="detail-seal" role="img" aria-label="落款：浩">浩</span>
                        </div>
                    </div>
                    <div id="detail-description" class="detail-description"></div>
                </div>
            </aside>
        </div>
    </div>

    <!-- 轻提示（例如点到还没画的日子） -->
    <div class="lm-toast" id="lm-toast" role="status" aria-live="polite"></div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="js/data.js?v=23.3"></script>
    <script src="js/typeset.js?v=1.0"></script>
    <script src="js/script.js?v=13.1"></script>
    <script src="js/day-6000.js?v=12.0"></script>
    <!-- Anniversary Effects Engine -->
    <script src="js/anniversary-effects.js?v=11.7"></script>
</body>

</html>
