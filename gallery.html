<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#150d21">
    <title>Love Minnie · 画信</title>
    <link rel="icon" href="images/sunflower.svg" type="image/svg+xml">

    <!-- 字体全部本地托管：手机不挂 VPN 也能打开 -->
    <link rel="stylesheet" href="fonts/wenkai/lxgwwenkaiscreen.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css?v=10.0">
    <link rel="stylesheet" href="css/day-6000.css?v=12.1">
</head>

<body>

    <!-- 线条图标（替代 Font Awesome，免外链） -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" /></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" /></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.8" y="5.2" width="16.4" height="14.6" rx="2.6" /><path d="M3.8 10h16.4M8.2 3.4v3.6M15.8 3.4v3.6" /></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M4.5 10.6 12 4.5l7.5 6.1v8.1a1.3 1.3 0 0 1-1.3 1.3H14.6v-5.4H9.4V20H5.8a1.3 1.3 0 0 1-1.3-1.3z" /></symbol>
        <symbol id="i-gallery" viewBox="0 0 24 24"><rect x="3.8" y="4.8" width="16.4" height="14.4" rx="2.6" /><circle cx="9" cy="9.8" r="1.5" /><path d="m4.4 16.8 4.4-4.1 3.3 3 2.6-2.3 5.1 4.6" /></symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4.5 7.5h8.8M18.3 7.5h1.2M4.5 16.5h2.2M11.7 16.5h7.8" /><circle cx="15.8" cy="7.5" r="2.3" /><circle cx="9.2" cy="16.5" r="2.3" /></symbol>
        <symbol id="i-sparkle" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 3.6 13.7 9 19 10.7l-5.3 1.7L12 17.8l-1.7-5.4L5 10.7 10.3 9z" /></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 20.4 10.8 19.3C6.2 15.2 3.4 12.6 3.4 9.4 3.4 6.8 5.4 4.9 8 4.9c1.5 0 2.9.7 4 1.9 1.1-1.2 2.5-1.9 4-1.9 2.6 0 4.6 1.9 4.6 4.5 0 3.2-2.8 5.8-7.4 9.9z" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M5 19l1-4.2 9.6-9.6a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L9.2 18z" /></symbol>
    </svg>

    <!-- 氛围光场 (The Rose Nebula) -->
    <div class="ambient-light"></div>
    <div class="noise-overlay"></div>

    <!-- 动态模糊背景 (From Artwork) -->
    <div class="bg-blur" id="bg-blur"></div>

    <!-- 日期胶囊 (Date Anchor) -->
    <div class="date-capsule" id="date-capsule"></div>

    <!-- 鼠标光晕（仅桌面） -->
    <div class="cursor-torch" id="torch"></div>

    <!-- ===================== HEADER ===================== -->
    <header class="app-header">
        <h1 class="logo"><a href="index.html" class="logo-link" aria-label="回首页">Love Minnie</a></h1>
        <nav class="month-nav">
            <button id="prev-month" class="nav-btn" aria-label="上个月">
                <svg class="icon" aria-hidden="true"><use href="#i-prev" /></svg>
            </button>
            <span id="current-month-label" class="month-label"></span>
            <button id="next-month" class="nav-btn" aria-label="下个月">
                <svg class="icon" aria-hidden="true"><use href="#i-next" /></svg>
            </button>
        </nav>

        <!-- Desktop Nav -->
        <nav class="desktop-nav">
            <a href="index.html" class="nav-link">首页</a>
            <a href="gallery.html" class="nav-link active">画廊</a>
        </nav>

        <div class="header-actions">
            <div class="theme-toggle" role="group" aria-label="季节主题">
                <button type="button" class="theme-btn" data-theme="spring" aria-label="春季主题">春</button>
                <button type="button" class="theme-btn" data-theme="summer" aria-label="夏季主题">夏</button>
                <button type="button" class="theme-btn" data-theme="autumn" aria-label="秋季主题">秋</button>
                <button type="button" class="theme-btn" data-theme="winter" aria-label="冬季主题">冬</button>
            </div>
            <button id="toggle-calendar" class="mobile-calendar-btn" aria-label="日历">
                <svg class="icon" aria-hidden="true"><use href="#i-calendar" /></svg>
            </button>
        </div>
    </header>

    <!-- ===================== MAIN LAYOUT ===================== -->
    <main class="app-container">

        <!-- === Calendar Sidebar === -->
        <aside id="calendar-sidebar" class="calendar-sidebar">
            <div class="calendar-grid">
                <div class="weekday-header">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                </div>
                <div id="calendar-days" class="days-grid">
                    <!-- Dynamically generated -->
                </div>
            </div>
            <!-- 本月小结 + 随机重温 -->
            <div class="sidebar-extras">
                <p class="month-digest" id="month-digest"></p>
                <button type="button" id="memory-lane-btn" class="memory-lane-btn">
                    <svg class="icon" aria-hidden="true"><use href="#i-sparkle" /></svg>
                    <span>随机重温一封</span>
                </button>
            </div>
            <div class="calendar-legend">
                <span><span class="legend-heart" aria-hidden="true"></span>有画信</span>
                <span><img src="images/sunflower.svg" class="sunflower-icon" alt="">还没到</span>
            </div>
        </aside>

        <!-- === Content Area === -->
        <section class="content-area">
            <!-- 今日画信：画在左、信在右（手机上画在上、信在下）；横图竖图同一套版式，只按画的比例分配空间 -->
            <section id="today-hero" class="today-hero" hidden role="button" tabindex="0" aria-label="查看今天的画">
                <div class="hero-art">
                    <img id="today-hero-img" src="" alt="今日画作" fetchpriority="high">
                </div>
                <div class="hero-letter">
                    <p class="hero-date" id="today-hero-date"></p>
                    <h2 class="hero-title" id="today-hero-title"></h2>
                    <span class="hero-rule" aria-hidden="true"></span>
                    <p class="hero-sign" id="today-hero-sign"></p>
                    <p class="hero-days" id="today-hero-days"></p>
                    <p class="hero-note" id="today-hero-note" hidden></p>
                </div>
            </section>
            <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>

            <!-- Empty State (for future days) -->
            <article id="empty-state" class="empty-state" style="display: none;">
                <img src="images/sunflower.svg" class="sunflower-icon" alt="">
                <h2 class="empty-title" id="empty-title">花期未至</h2>
                <p class="empty-text empty-cn" id="empty-date-text"></p>
                <p class="empty-text empty-en" id="empty-subtext"></p>
            </article>
        </section>

    </main>

    <!-- ===================== TIMELINE STRIP ===================== -->
    <nav class="timeline-strip" aria-label="按日期浏览">
        <button id="timeline-prev" class="timeline-nav-btn" aria-label="往前">
            <svg class="icon" aria-hidden="true"><use href="#i-prev" /></svg>
        </button>
        <div id="timeline-container" class="timeline-container">
            <!-- Thumbnails injected here -->
        </div>
        <button id="timeline-next" class="timeline-nav-btn" aria-label="往后">
            <svg class="icon" aria-hidden="true"><use href="#i-next" /></svg>
        </button>
    </nav>

    <!-- ===================== MOBILE BOTTOM NAVIGATION ===================== -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
        <div class="nav-items">
            <button class="nav-item" id="nav-home" aria-label="返回首页">
                <svg class="icon" aria-hidden="true"><use href="#i-home" /></svg>
                <span>首页</span>
            </button>
            <button class="nav-item active" id="nav-gallery" aria-label="画廊">
                <svg class="icon" aria-hidden="true"><use href="#i-gallery" /></svg>
                <span>画廊</span>
            </button>
            <button class="nav-item" id="nav-calendar" aria-label="日历">
                <svg class="icon" aria-hidden="true"><use href="#i-calendar" /></svg>
                <span>日历</span>
            </button>
            <button type="button" class="nav-item" id="nav-settings" aria-label="设置" aria-expanded="false" aria-controls="settings-sheet">
                <svg class="icon" aria-hidden="true"><use href="#i-sliders" /></svg>
                <span>设置</span>
            </button>
        </div>
    </nav>

    <!-- 日历 Bottom Sheet 遮罩层 -->
    <div class="calendar-overlay" id="calendar-overlay"></div>

    <!-- ===================== SETTINGS BOTTOM SHEET ===================== -->
    <div class="settings-sheet" id="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="gallery-settings-title" aria-hidden="true">
        <div class="settings-handle"></div>
        <div class="settings-content">
            <h3 class="settings-title" id="gallery-settings-title">季节主题</h3>
            <div class="settings-section">
                <div class="theme-options" id="mobile-theme-options">
                    <button type="button" class="theme-option" data-theme="spring">
                        <span class="theme-swatch" aria-hidden="true"></span>
                        <span class="theme-name">春</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="summer">
                        <span class="theme-swatch" aria-hidden="true"></span>
                        <span class="theme-name">夏</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="autumn">
                        <span class="theme-swatch" aria-hidden="true"></span>
                        <span class="theme-name">秋</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="winter">
                        <span class="theme-swatch" aria-hidden="true"></span>
                        <span class="theme-name">冬</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="settings-overlay" id="settings-overlay"></div>

    <!-- ===================== DETAIL MODAL ===================== -->
    <div id="detail-modal" class="detail-modal" aria-hidden="true">
        <div class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <div class="detail-media">
                <img id="detail-image" src="" alt="">
                <p class="detail-hint" id="detail-hint" aria-hidden="true">左右滑动，看前后几天</p>
            </div>
            <aside class="detail-side">
                <div class="detail-header">
                    <div class="detail-meta">
                        <div id="detail-date" class="detail-date"></div>
                        <div id="detail-sub" class="detail-sub"></div>
                    </div>
                    <button id="detail-close" class="detail-close" type="button" aria-label="关闭">
                        <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
                    </button>
                </div>
                <div class="detail-body">
                    <div class="detail-letter-wrap">
                        <h2 id="detail-title" class="detail-title"></h2>
                        <div id="detail-letter" class="detail-letter"></div>
                        <p id="detail-sign" class="detail-sign"></p>
                    </div>
                    <div id="detail-description" class="detail-description"></div>
                </div>
            </aside>
        </div>
    </div>

    <!-- 轻提示（例如点到还没画的日子） -->
    <div class="lm-toast" id="lm-toast" role="status" aria-live="polite"></div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="js/data.js?v=22.0"></script>
    <script src="js/typeset.js?v=1.0"></script>
    <script src="js/script.js?v=12.0"></script>
    <script src="js/day-6000.js?v=12.0"></script>
    <!-- Anniversary Effects Engine -->
    <script src="js/anniversary-effects.js?v=11.7"></script>
</body>

</html>
