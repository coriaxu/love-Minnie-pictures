<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minnie's 2026 · Garden of Memories</title>

    <!-- Google Fonts: Bodoni Moda + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,900;1,6..96,400&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Pinyon+Script&family=Cinzel:wght@400;700;900&display=swap"
        rel="stylesheet">
    <!-- 毛笔书法体：今日卡竖版大字 -->
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <!-- LXGW WenKai (Handwritten Style) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
    <link rel="icon" href="images/sunflower.svg" type="image/svg+xml">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css?v=9.8">
    <!-- Year in Review Poster -->
    <link rel="stylesheet" href="css/year-review.css?v=9.1">
    <link rel="stylesheet" href="css/day-6000.css?v=11.9">
</head>

<body>

    <!-- 氛围光场 (The Rose Nebula) -->
    <div class="ambient-light"></div>
    <div class="noise-overlay"></div>

    <!-- SVG 滤镜：今日卡金色笔刷的毛边质感 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="brush-rough" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.028" numOctaves="3" seed="7" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <!-- 动态模糊背景 (From Artwork) -->
    <div class="bg-blur" id="bg-blur"></div>

    <!-- 日期胶囊 (Date Anchor) -->
    <div class="date-capsule" id="date-capsule">Day 1 · Jan 1</div>

    <!-- 光标 -->
    <div class="cursor-torch" id="torch"></div>
    <div class="cursor-dot" id="dot"></div>

    <!-- ===================== HEADER ===================== -->
    <header class="app-header">
        <h1 class="logo">Love Minnie</h1>
        <nav class="month-nav">
            <button id="prev-month" class="nav-btn" aria-label="Previous Month">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span id="current-month-label" class="month-label">January 2026</span>
            <button id="next-month" class="nav-btn" aria-label="Next Month">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </nav>
        
        <!-- Desktop Nav -->
        <nav class="desktop-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="gallery.html" class="nav-link active">Gallery</a>
            <a href="moments.html" class="nav-link">Moments</a>
        </nav>

        <div class="header-actions">
            <div class="theme-toggle" role="group" aria-label="Season themes">
                <button type="button" class="theme-btn" data-theme="spring" aria-label="Spring theme">春</button>
                <button type="button" class="theme-btn" data-theme="summer" aria-label="Summer theme">夏</button>
                <button type="button" class="theme-btn" data-theme="autumn" aria-label="Autumn theme">秋</button>
                <button type="button" class="theme-btn" data-theme="winter" aria-label="Winter theme">冬</button>
            </div>
            <button id="toggle-calendar" class="mobile-calendar-btn" aria-label="Toggle Calendar">
                <i class="fa-solid fa-calendar-days"></i>
            </button>
        </div>
    </header>

    <!-- ===================== MAIN LAYOUT ===================== -->
    <main class="app-container">

        <!-- === Calendar Sidebar === -->
        <aside id="calendar-sidebar" class="calendar-sidebar open">
            <div class="calendar-grid">
                <div class="weekday-header">
                    <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                </div>
                <div id="calendar-days" class="days-grid">
                    <!-- Dynamically generated -->
                </div>
            </div>
            <!-- 本月小结 + 随机重温 -->
            <div class="sidebar-extras">
                <p class="month-digest" id="month-digest"></p>
                <button type="button" id="memory-lane-btn" class="memory-lane-btn">
                    <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
                    <span>随机重温一封</span>
                </button>
            </div>
            <div class="calendar-legend">
                <span><i class="fa-solid fa-circle" style="color: var(--love-core);"></i> Has artwork</span>
                <span><img src="images/sunflower.svg" class="sunflower-icon" alt="🌻"> Coming soon</span>
            </div>
        </aside>

        <!-- === Content Area === -->
        <section class="content-area">
            <!-- 今日情书 Hero：当前查看月份包含今天时置顶呈现 -->
            <section id="today-hero" class="today-hero" hidden role="button" tabindex="0" aria-label="查看今天的画">
                <div class="today-hero-media">
                    <img id="today-hero-img" src="" alt="今日画作">
                </div>
                <div class="today-hero-letter">
                    <p class="today-hero-eyebrow">For My Wife · 致熊老婆</p>
                    <h2 class="today-hero-date" id="today-hero-date"></h2>
                    <p class="today-hero-theme" id="today-hero-theme" hidden></p>
                    <div class="today-hero-rule" aria-hidden="true"></div>
                    <p class="today-hero-days" id="today-hero-days"></p>
                    <div class="today-hero-rule today-hero-rule-b" aria-hidden="true"></div>
                    <div class="today-hero-divider" aria-hidden="true"></div>
                    <p class="today-hero-text" id="today-hero-text"></p>
                    <p class="today-hero-sign"><span class="sign-dash" aria-hidden="true"></span>Love<span
                            class="sign-dash" aria-hidden="true"></span></p>
                    <span class="today-hero-hint" aria-hidden="true">点开重温 →</span>
                </div>
            </section>
            <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>

            <!-- Empty State (for future days) -->
            <article id="empty-state" class="empty-state" style="display: none;">
                <img src="images/sunflower.svg" class="sunflower-icon" alt="Waiting">
                <h2 class="empty-title" id="empty-title">花期未至</h2>
                <p class="empty-text empty-cn" id="empty-date-text"></p>
                <p class="empty-text empty-en" id="empty-subtext"></p>
            </article>
        </section>

    </main>

    <!-- ===================== TIMELINE STRIP ===================== -->
    <nav class="timeline-strip">
        <button id="timeline-prev" class="timeline-nav-btn">
            <i class="fa-solid fa-angle-left"></i>
        </button>
        <div id="timeline-container" class="timeline-container">
            <!-- Thumbnails injected here -->
        </div>
        <button id="timeline-next" class="timeline-nav-btn">
            <i class="fa-solid fa-angle-right"></i>
        </button>
    </nav>

    <!-- ===================== MOBILE BOTTOM NAVIGATION ===================== -->
    <!-- 方案 A：极简沉浸派 - 仅在 600px 以下显示 -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
        <div class="nav-items">
            <button class="nav-item" id="nav-home" aria-label="返回首页">
                <i class="fa-solid fa-house"></i>
                <span>首页</span>
            </button>
            <button class="nav-item active" id="nav-gallery" aria-label="画廊">
                <i class="fa-solid fa-images"></i>
                <span>画廊</span>
            </button>
            <button class="nav-item" id="nav-calendar" aria-label="日历">
                <i class="fa-regular fa-calendar"></i>
                <span>日历</span>
            </button>
            <!-- New Item: Moments -->
            <a href="moments.html" class="nav-item" aria-label="点滴">
                <i class="fa-solid fa-timeline"></i>
                <span>点滴</span>
            </a>
            <button class="nav-item" id="nav-settings" aria-label="设置">
                <i class="fa-solid fa-gear"></i>
                <span>设置</span>
            </button>
        </div>
    </nav>

    <!-- 日历 Bottom Sheet 遮罩层 -->
    <div class="calendar-overlay" id="calendar-overlay"></div>

    <!-- ===================== SETTINGS BOTTOM SHEET ===================== -->
    <!-- 设置面板：包含季节主题切换 -->
    <div class="settings-sheet" id="settings-sheet">
        <div class="settings-handle"></div>
        <div class="settings-content">
            <h3 class="settings-title">主题设置</h3>
            <div class="settings-section">
                <label class="settings-label">季节主题</label>
                <div class="theme-options" id="mobile-theme-options">
                    <button type="button" class="theme-option" data-theme="spring">
                        <span class="theme-icon">🌸</span>
                        <span class="theme-name">春</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="summer">
                        <span class="theme-icon">🌿</span>
                        <span class="theme-name">夏</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="autumn">
                        <span class="theme-icon">🍂</span>
                        <span class="theme-name">秋</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="winter">
                        <span class="theme-icon">❄️</span>
                        <span class="theme-name">冬</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="settings-overlay" id="settings-overlay"></div>

    <!-- ===================== DETAIL MODAL ===================== -->
    <div id="detail-modal" class="detail-modal" aria-hidden="true">
        <div class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <div class="detail-media">
                <img id="detail-image" src="" alt="Artwork detail">
            </div>
            <aside class="detail-side">
                <div class="detail-header">
                    <div class="detail-meta">
                        <div id="detail-title" class="detail-title">Untitled</div>
                        <div id="detail-date" class="detail-date">Jan 1, 2026</div>
                    </div>
                    <button id="detail-close" class="detail-close" type="button" aria-label="Back">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="detail-body">
                    <!-- Ruogu Mod: Label Removed -->
                    <div id="detail-description" class="detail-description"></div>
                    <div id="detail-letter" class="detail-letter"></div>
                    <p class="detail-sign" aria-hidden="true">Love</p>
                </div>
            </aside>
        </div>
    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="js/data.js?v=16.5"></script>
    <script src="js/script.js?v=10.8"></script>
    <script src="js/day-6000.js?v=11.9"></script>
    <!-- Anniversary Effects Engine -->
    <script src="js/anniversary-effects.js?v=11.6"></script>
    <!-- Year in Review Poster Generator -->
    <script src="js/year-review.js?v=9.1"></script>
</body>

</html>
