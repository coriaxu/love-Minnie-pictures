<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#150d21">
    <title>Love Minnie · 今天的画信</title>
    <link rel="icon" href="images/sunflower.svg" type="image/svg+xml">
    <!-- 字体全部本地托管：手机不挂 VPN 也能打开 -->
    <link rel="stylesheet" href="fonts/wenkai/lxgwwenkaiscreen.css">
    <link rel="stylesheet" href="css/home.css?v=1.0">
    <link rel="stylesheet" href="css/day-6000.css?v=12.1">
    <link rel="prefetch" href="gallery.html">
</head>

<body class="home-page">

    <!-- 背景零星的星；向日葵星盘画在 .home-disc 里，跟着版面走 -->
    <canvas class="home-sky" id="home-sky" aria-hidden="true"></canvas>

    <div class="home">
        <header class="home-top">
            <span class="home-mark">Love Minnie</span>
            <button type="button" id="day-6000-archive" class="home-archive" hidden>6000 天</button>
        </header>

        <main class="home-main">
            <div class="home-disc" id="home-disc">
                <canvas class="home-disc-canvas" id="home-disc-canvas" aria-hidden="true"></canvas>
                <!-- 月洞窗：隔着窗纸看见今天那幅画，点开就是今天的画信 -->
                <a class="home-moon" id="home-moon" href="gallery.html" aria-label="拆开今天的画信">
                    <span class="home-moon-art" id="home-moon-art"></span>
                    <span class="home-moon-paper" aria-hidden="true"></span>
                </a>
            </div>

            <div class="home-words">
                <h1 class="home-greet">
                    <span class="ts-u">熊老婆，</span><wbr><span class="ts-u home-status" id="home-status">今天的画信到了。</span>
                </h1>
                <p class="home-meta" id="home-meta"></p>
                <a class="home-cta" id="home-cta" href="gallery.html">拆开今天的画信</a>
            </div>
        </main>
    </div>

    <noscript>
        <p class="home-noscript"><a href="gallery.html">打开画廊，看看今天的画与话。</a></p>
    </noscript>

    <script src="js/typeset.js?v=1.0"></script>
    <script src="js/home.js?v=1.0"></script>
    <script src="js/day-6000.js?v=12.0"></script>
    <script src="js/anniversary-effects.js?v=11.7"></script>
</body>

</html>
